name: Deploy to Vercel

on:
  push:
    branches: [deploy-teacher]
  pull_request:
    branches: [deploy-teacher]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build application
        run: pnpm build

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/deploy-teacher' && github.event_name == 'push'
        run: |
          pnpm add -D vercel
          npx vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
