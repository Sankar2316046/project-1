name: Deploy to Vercel

on:
  push:
    branches: [deploy-teacher]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - run: pnpm install

      - name: Deploy to Vercel
        run: |
          pnpm add -D vercel
          npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
